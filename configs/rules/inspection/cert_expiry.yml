# 证书过期检查
# 检测集群中的 TLS Secret（Go 代码层做 JSON 解析和到期日计算）
name: "cert_expiry"
description: "TLS Secret 证书检查"
query: |
  MATCH (s:K8sResource{kind:'Secret',is_deleted:false})
  WHERE s.K8sResource.resource_define CONTAINS 'kubernetes.io/tls'
  RETURN s.K8sResource.name AS name, s.K8sResource.name_space AS namespace
  LIMIT 100
check:
  type: min_rows
  threshold: 1
severity: warning
suggestion: "发现 TLS Secret，请检查证书有效期并确保及时续期"
