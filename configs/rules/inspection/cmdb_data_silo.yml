# 数据孤岛检测
# 检测图谱中断开连接的孤立节点
name: "cmdb_data_silo"
description: "孤立资源节点"
query: |
  MATCH (v:K8sResource{is_deleted:false})
  WHERE NOT (v)-[]-()
  RETURN v.K8sResource.name AS name, v.K8sResource.name_space AS namespace, v.K8sResource.kind AS kind
  LIMIT 100
check:
  type: min_rows
  threshold: 1
severity: info
suggestion: "该资源在图谱中无关联关系，可能是孤立的无效资源或采集异常"
