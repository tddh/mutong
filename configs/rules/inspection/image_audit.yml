# 镜像审计
# 检测使用 latest 标签的 Pod
name: "image_audit"
description: "使用 latest 标签"
query: |
  MATCH (p:K8sResource{kind:'Pod',is_deleted:false})
  WHERE p.K8sResource.resource_define CONTAINS ':latest'
  RETURN p.K8sResource.name AS name, p.K8sResource.name_space AS namespace
  LIMIT 200
check:
  type: min_rows
  threshold: 1
severity: warning
suggestion: "使用了 latest 标签的镜像，建议固定镜像版本以确保可复现性"
