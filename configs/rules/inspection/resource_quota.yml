# 资源使用检查
# 检测节点上 Pod 密度过高（> 50 个 Pod）
name: "resource_quota"
description: "节点 Pod 密度过高"
query: |
  MATCH (n:K8sResource{kind:'Node',is_deleted:false})
  MATCH (p:K8sResource{kind:'Pod',is_deleted:false})-[:RunsOn]->(n)
  WITH n, count(p) AS podCount
  WHERE podCount > 50
  RETURN n.K8sResource.name AS name, "cluster" AS namespace
check:
  type: min_rows
  threshold: 1
severity: warning
suggestion: "节点 Pod 密度过高，检查资源使用率，考虑扩容或迁移部分 Pod"
