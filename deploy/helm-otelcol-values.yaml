mode: daemonset
image:
  repository: "registry.cn-hangzhou.aliyuncs.com/tddh/opentelemetry-collector-contrib"
  tag: "0.149.0"
config:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"
        grpc:
          endpoint: "0.0.0.0:4317"
  processors:
    batch:
      timeout: 5s
      send_batch_size: 1000
  exporters:
    kafka:
      brokers: ["kafka:9092"]
      topic: 
        default: "otlp_spans" 
      producer:
        compression: zstd
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [kafka]
