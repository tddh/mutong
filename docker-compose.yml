services:
  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mutong-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mutong
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: mutong
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mutong -d mutong"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # NebulaGraph graphd service
  nebula:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: mutong-nebula
    ports:
      - "9669:9669"
      - "19669:19669"
      - "19670:19670"
    environment:
      USER: root
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9669 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redpanda (Kafka-compatible lightweight message queue)
  kafka:
    image: vectorized/redpanda:v24.2.5
    container_name: mutong-kafka
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis 7 (alpine)
  redis:
    image: redis:7-alpine
    container_name: mutong-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${MUTONG_REDIS_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${MUTONG_REDIS_PASSWORD:-change_me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Mutong 应用
  mutong:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mutong-app
    ports:
      - "8888:8888"
    environment:
      MUTONG_DB_USER: mutong
      MUTONG_DB_PASSWORD: change_me
      MUTONG_NEBULA_USER: root
      MUTONG_NEBULA_PASS: change_me
      MUTONG_REDIS_ADDR: redis:6379
      MUTONG_REDIS_PASSWORD: ${MUTONG_REDIS_PASSWORD:-change_me}
    depends_on:
      postgres:
        condition: service_healthy
      nebula:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
