<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 重明平台</title>
    <link rel="stylesheet" href="/view/shared/common.css">
    <script src="/view/jslibs/vue.global.min.js"></script>
    <script src="/view/shared/api.js"></script>
    <script src="/view/shared/stats.js"></script>
    <script src="/view/shared/components.js"></script>
</head>
<body>
    <div id="app">
        <nav-bar></nav-bar>
        <div class="container">
            <div class="dashboard-header">运维仪表盘</div>
            
            <div class="stat-card-grid">
                <stat-card title="资源总数" :value="stats.resources.total" color="#1890ff"></stat-card>
                <stat-card title="节点数" :value="stats.resources.nodes" color="#52c41a"></stat-card>
                <stat-card title="Pod 数" :value="stats.resources.pods" color="#722ed1"></stat-card>
                <stat-card title="活跃告警" :value="stats.alerts.active" color="#ff4d4f"></stat-card>
                <stat-card title="被抑制" :value="stats.alerts.suppressed" color="#faad14"></stat-card>
                <stat-card title="巡检异常" :value="stats.inspection.issues" :color="stats.inspection.issues > 0 ? '#faad14' : '#52c41a'"></stat-card>
            </div>
            
            <h3>⚡ 快捷入口</h3>
            <div class="quick-links">
                <a href="/view/topology/index.html" class="quick-link">📊 查看拓扑图</a>
                <a href="/view/alerts/index.html" class="quick-link">🚨 告警管理</a>
                <a href="/view/inspection/index.html" class="quick-link">🔍 巡检中心</a>
                <a href="/view/resource_table.html" class="quick-link">📋 资源表格</a>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const { NavBar, StatCard } = sharedComponents;

        createApp({
            components: { NavBar, StatCard },
            setup() {
                const stats = ref({
                    resources: { total: 0, nodes: 0, pods: 0 },
                    alerts: { active: 0, suppressed: 0 },
                    inspection: { issues: 0 }
                });

                onMounted(async () => {
                    stats.value = await fetchOverviewStats();
                });

                return { stats };
            }
        }).mount('#app');
    </script>
</body>
</html>
