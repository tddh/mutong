<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 重明平台</title>
</head>
<body>
    <div id="app">
        <nav-bar></nav-bar>
        <div class="container">
            <page-header title="运维仪表盘" :desc="desc"></page-header>

            <div class="m-stat-grid" v-if="loading">
                <div class="m-stat-card" v-for="i in 6" :key="i">
                    <div class="m-stat-card-text">
                        <span class="m-stat-card-title">加载中</span>
                        <m-skeleton :rows="1"></m-skeleton>
                    </div>
                </div>
            </div>
            <div class="m-stat-grid" v-else>
                <stat-card title="资源总数" :value="stats.resources.total" tone="accent" icon="table"></stat-card>
                <stat-card title="节点数" :value="stats.resources.nodes" tone="success" icon="cluster"></stat-card>
                <stat-card title="Pod 数" :value="stats.resources.pods" tone="alt" icon="topology"></stat-card>
                <stat-card title="活跃告警" :value="stats.alerts.active" :tone="stats.alerts.active > 0 ? 'danger' : 'neutral'" icon="alert"></stat-card>
                <stat-card title="被抑制" :value="stats.alerts.suppressed" tone="warning" icon="inspect"></stat-card>
                <stat-card title="巡检异常" :value="stats.inspection.issues" :tone="stats.inspection.issues > 0 ? 'warning' : 'neutral'" icon="status"></stat-card>
            </div>

            <h2 class="m-section-title">快捷入口</h2>
            <div class="m-quick-grid">
                <a class="m-quick" href="/view/topology/index.html"><m-icon name="topology"></m-icon><span>资源拓扑</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
                <a class="m-quick" href="/view/alerts/index.html"><m-icon name="alert"></m-icon><span>告警管理</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
                <a class="m-quick" href="/view/inspection/index.html"><m-icon name="inspect"></m-icon><span>巡检中心</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
                <a class="m-quick" href="/view/resource-table.html"><m-icon name="table"></m-icon><span>资源表格</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
                <a class="m-quick" href="/view/terminal/index.html"><m-icon name="terminal"></m-icon><span>Web 终端</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
                <a class="m-quick" href="/view/status/index.html"><m-icon name="status"></m-icon><span>系统状态</span><m-icon class="m-quick-arrow" name="arrow" :size="14"></m-icon></a>
            </div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
