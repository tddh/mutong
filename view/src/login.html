<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 重明平台</title>
    <link rel="stylesheet" href="/view/src/styles/common.css">
    <style>
        .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-color); }
        .login-card { width: 400px; background: var(--card-bg); border-radius: var(--card-radius); box-shadow: var(--shadow-sm); padding: 40px 32px; }
        .login-brand { text-align: center; margin-bottom: 32px; }
        .login-brand h1 { font-size: 24px; font-weight: 700; color: var(--primary-color); }
        .login-brand .brand-icon { font-size: 48px; margin-bottom: 8px; }
        .login-brand p { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 14px; color: var(--text-primary); margin-bottom: 6px; font-weight: 500; }
        .field input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .field input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(24,144,255,0.1); }
        .login-btn { width: 100%; height: 40px; background: var(--primary-color); color: #fff; border: none; border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .login-btn:hover { background: #40a9ff; }
        .login-btn:disabled { background: #91d5ff; cursor: not-allowed; }
        .login-error { background: #fff2e8; border: 1px solid #ffd591; border-radius: 4px; padding: 8px 12px; color: #d4380d; font-size: 13px; margin-bottom: 16px; }
        .sso-btn { width: 100%; height: 40px; background: #fff; color: var(--primary-color); border: 2px solid var(--primary-color); border-radius: 4px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; }
        .sso-btn:hover { background: #e6f7ff; border-color: #40a9ff; }
        .hybrid-divider { display: flex; align-items: center; margin: 20px 0; color: var(--text-secondary); font-size: 12px; }
        .hybrid-divider::before, .hybrid-divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .hybrid-divider span { padding: 0 12px; }
        .login-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-secondary); text-align: center; }
        .login-footer code { background: var(--bg-color); padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-wrapper">
            <div class="login-card">
                <div class="login-brand">
                    <div class="brand-icon">&#x1F3D4;&#xFE0F;</div>
                    <h1>牧童 · 重明</h1>
                    <p>Kubernetes AIOps 智能运维平台</p>
                </div>

                <div v-if="error" class="login-error">⚠️ {{ error }}</div>

<button v-if="authMode === 'hybrid' || authMode === 'zitadel'" type="button" class="sso-btn" @click="loginWithZitadel">🔐 {{ ssoLabel }} 登录</button>

<div v-if="authMode === 'hybrid'" class="hybrid-divider"><span>或使用密码登录</span></div>

                <form v-if="authMode !== 'zitadel'" @submit.prevent="handleLogin">
                    <div class="field">
                        <label>用户名</label>
                        <input v-model="username" type="text" placeholder="请输入用户名" autocomplete="username">
                    </div>
                    <div class="field">
                        <label>密码</label>
                        <input v-model="password" type="password" placeholder="请输入密码" autocomplete="current-password">
                    </div>

                    <button type="submit" class="login-btn" :disabled="loading">
                        {{ loading ? '登录中...' : '登 录' }}
                    </button>
                </form>

                <div class="login-footer">
                    <p>命令行登录：<code>mutongctl auth login</code></p>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./login.js"></script>
</body>
</html>
